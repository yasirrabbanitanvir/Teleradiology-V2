<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Telesoft PACS System</title>
  <link rel="stylesheet" href="./styles/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="main-wrapper">
  <header>
    <nav>
      <img src="/static/telesoftlogo.jpeg" alt="Telesoft" class="logo" />
      <ul>
        <li><a href="#">Password</a></li>
        <li><a href="template.html">Templates</a></li>
        <li><a href="#">Academics</a></li>
        <li><a href="#" onclick="logout()">Log Off</a></li>
      </ul>
    </nav>
  </header>

  <div class="user-selection">
    <div class="user-info-display">
      <label>Logged in as:</label>
      <strong id="user-display-name">Loading...</strong>
    </div>
    <div class="live-clock" id="live-clock"></div>
  </div>

  <section class="search-panel">
    <div class="search-inputs-col">
    <div class="search-inputs">
      <input type="text" id="patient-name" placeholder="Patient Name" />
      <input type="text" id="patient-id" placeholder="Patient ID" />
      <input type="date" id="scan-start-date" />
      <input type="date" id="scan-end-date" />
      <select id="status">
        <option value="All">All</option>
        <option value="Not Assigned">Not Assigned</option>
        <option value="Unreported">Unreported</option>
        <option value="Draft">Draft</option>
        <option value="Reviewed">Reviewed</option>
        <option value="Reported">Reported</option>
      </select>
      <select id="center">
        <option value="ALL">All Centers</option>
      </select>
      <div class="center-search">
        <input type="text" id="center-search-input" placeholder="All Centers" autocomplete="off" />
        <div class="center-search-list" id="center-search-list"></div>
      </div>
      <label>
        <input type="checkbox" id="emergency" />
        Show only Emergency Cases
      </label>
    </div>
      <button type="button" class="clear-search-btn" onclick="clearSearch()">Clear Search</button>
    </div>
    <div class="modality-filter">
      <label>
        <input type="checkbox" id="modality-all" checked />
        ALL
      </label>
      <div class="modality-row">
        <label><input type="checkbox" class="modality-checkbox" value="CT" checked /> CT</label>
        <label><input type="checkbox" class="modality-checkbox" value="US" checked /> US</label>
        <label><input type="checkbox" class="modality-checkbox" value="XA" checked /> XA</label>
        <label><input type="checkbox" class="modality-checkbox" value="SC" checked /> SC</label>
        <label><input type="checkbox" class="modality-checkbox" value="AN" checked /> AN</label>
        <label><input type="checkbox" class="modality-checkbox" value="RF" checked /> RF</label>
        <label><input type="checkbox" class="modality-checkbox" value="OT" checked /> OT</label>
      </div>
      <div class="modality-row">
        <label><input type="checkbox" class="modality-checkbox" value="MR" checked /> MR</label>
        <label><input type="checkbox" class="modality-checkbox" value="CR" checked /> CR</label>
        <label><input type="checkbox" class="modality-checkbox" value="NM" checked /> NM</label>
        <label><input type="checkbox" class="modality-checkbox" value="PT" checked /> PT</label>
        <label><input type="checkbox" class="modality-checkbox" value="DX" checked /> DX</label>
        <label><input type="checkbox" class="modality-checkbox" value="PX" checked /> PX</label>
        <label><input type="checkbox" class="modality-checkbox" value="MG" checked /> MG</label>
      </div>
    </div>
    <div class="search-actions">
      <button onclick="searchStudies()">Search</button>
      <button id="refresh-btn" onclick="refreshCurrentPage()">Refresh</button>
    </div>
  </section>

  <section class="assign-panel" id="assign-panel">
    <label class="assign-search-label" for="assign-doctor-search">Search Doctor/Group:</label>
    <input type="text" id="assign-doctor-search" placeholder="Search" autocomplete="off" />
    <select id="assign-doctors" multiple>
      <option disabled>Loading doctors...</option>
    </select>
    <button id="assign-btn">Assign</button>
  </section>

  <section class="study-list">
    <div style="padding:6px 8px;background:#4cb85c;">
      <button id="load-studies-btn" onclick="loadSelectedStudies()" style="background:#f5deb3;color:#000;font-weight:bold;border:1px solid #999;padding:3px 10px;cursor:pointer;">Load Studies</button>
    </div>
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="select-all" /></th>
          <th>DICOM Viewer</th>
          <th>History</th>
          <th>Patient Name</th>
          <th>Patient ID</th>
          <th>Age</th>
          <th>Sex</th>
          <th>Body Part</th>
          <th>Modality</th>
          <th>Institute</th>
          <th>Receive Date/Time</th>
          <th>Refd By</th>
          <th></th>
          <th>Status</th>
          <th></th>
          <th></th>
          <th>Reported By</th>
          <th>Group</th>
          <th class="lock-th">Lock</th>
        </tr>
      </thead>
      <tbody id="study-table-body"></tbody>
    </table>
  </section>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-left">© 2026 Telesoft. All rights reserved.</div>
      <div class="footer-right">Developed by Telesoft | +8801979797234-9</div>
    </div>
  </footer>

  <script src="./script/queryBar.js"></script>
  <script src="./script/seriesPanel.js?v=6"></script>
  <script src="./script/script.js"></script>
  <script src="./script/extraViewers.js"></script>
</body>
</html>
