<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
  <title>Medical Report</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Calibri', Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #000000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .saved-reports-bar {
      background: white;
      border-bottom: 2px solid #c8a96e;
      flex-shrink: 0;
      display: none;
    }
    .saved-reports-bar.visible {
      display: block;
    }
    .saved-reports-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .saved-reports-table thead th {
      background: #2c3e7a;
      color: white;
      padding: 7px 14px;
      text-align: left;
      font-weight: 600;
      border-right: 1px solid #3a4f9a;
      white-space: nowrap;
    }
    .saved-reports-table thead th:last-child {
      border-right: none;
    }
    .saved-reports-table tbody tr {
      background: #f5e6c8;
      border-bottom: 1px solid #d4b87a;
      transition: background 0.15s;
    }
    .saved-reports-table tbody td {
      padding: 7px 14px;
      color: #333;
      border-right: 1px solid #d4b87a;
      vertical-align: middle;
      white-space: nowrap;
    }
    .saved-reports-table tbody td:last-child {
      border-right: none;
    }
    .saved-reports-table tbody tr.active {
      background: #cfe8cf;
    }
    .report-viewer {
      display: none;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .report-viewer.visible {
      display: block;
    }
    .report-viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 28px;
      background: #f4f6fb;
      border-bottom: 1px solid #d9deea;
    }
    .report-viewer-meta {
      font-size: 14px;
      color: #222;
    }
    .report-viewer-meta strong {
      margin-right: 6px;
    }
    .report-viewer-actions {
      display: flex;
      gap: 8px;
    }
    .report-viewer-actions button {
      padding: 6px 14px;
      font-size: 14px;
      border: 1px solid #2c3e7a;
      border-radius: 3px;
      background: white;
      color: #2c3e7a;
      cursor: pointer;
    }
    .report-viewer-actions button.primary {
      background: #2c3e7a;
      color: white;
    }
    .report-viewer-body {
      padding: 14px 28px 28px;
    }
    .report-viewer-body .ql-container {
      border: 1px solid #ddd !important;
      margin-top: 10px;
    }
    .report-viewer-body .ql-editor {
      min-height: 300px;
      cursor: default;
    }
    .report-viewer-doctor {
      margin-top: 18px;
      font-size: 15px;
      font-weight: bold;
      color: #000000;
    }
    .saved-reports-table tbody td.view-report-cell {
      cursor: pointer;
      transition: background 0.15s;
    }
    .saved-reports-table tbody td.view-report-cell:hover {
      background: #cfe0fa;
    }
    .saved-reports-table tbody tr.active td.view-report-cell:hover {
      background: #b9dcb9;
    }
    .report-file-link {
      color: #0066cc;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }
    .report-file-link:hover {
      text-decoration: underline;
    }
    .word-icon {
      display: inline-block;
      background: #1a56db;
      color: white;
      font-size: 9px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 2px;
      letter-spacing: 0.3px;
    }
    .delete-report-btn {
      background: none;
      border: none;
      color: #c0392b;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .delete-report-btn:hover {
      background: #fdecea;
    }
    .top-bar {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 12px 20px;
    }
    .patient-info {
      display: flex;
      gap: 20px;
      font-size: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      margin-bottom: 10px;
    }
    .patient-info span {
      color: #000000;
    }
    .patient-info strong {
      color: #000000;
      margin-left: 5px;
    }
    .controls-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .template-controls {
      display: none;
      gap: 10px;
      align-items: center;
    }
    .template-controls.visible {

    }
    .controls-row label {
      font-size: 14px;
      font-weight: 500;
      color: #000000;
    }
    .controls-row select {
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: white;
      min-width: 150px;
      color: #000000;
    }
    .right-controls {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .submit-btn {
      background: #0066cc;
      color: white;
      border: none;
      padding: 7px 18px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 14px;
      font-weight: 500;
    }
    .submit-btn:hover {

    }
    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status-msg {
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 3px;
      display: none;
    }
    .status-msg.success {
      display: inline-block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status-msg.error {
      display: inline-block;
      background: #f8d7da;

      border: 1px solid #f5c6cb;
    }
    .main-container {
      display: flex;
      flex: 1;
      min-height: 0;
      background: #f5f5f5;
    }
    .sidebar {
      width: 250px;
      background: white;
      border-right: 1px solid #ddd;
      padding: 15px;
      overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #000000;

    }
    .sidebar select {

      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 14px;
      color: #000000;
    }
    .content-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 8px;
      overflow: auto;
    }
    .page-wrapper {
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }
    .page-content {
      padding: 14px 28px 24px;
    }
    .header-title {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #000000;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #000000;
      padding-bottom: 6px;
    }
    .patient-table {
      width: 100%;
      border: 2px solid #000000;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 15px;
      line-height: 1.3;
    }
    .patient-table tr {
      border: 1px solid #000000;
    }
    .patient-table td {

      color: #000000;

      font-size: 15px;
      line-height: 1.3;

    .patient-table strong {

    }
    .label-col {

      width: 120px;
      color: #000000;

    }
    .colon-col {

      width: 25px;

      color: #000000;

    }
    .value-col {

      font-size: 15px;
    }

    #editor {

      font-family: 'Calibri', Arial, sans-serif;
      border: 1px solid #ddd;
      margin-bottom: 15px;
      min-height: 540px;
    }
    .ql-toolbar {
      background: #fafafa;
      border: 1px solid #ddd !important;
      border-bottom: none !important;
    }
    .ql-container {
      border: 1px solid #ddd !important;
      font-family: 'Calibri', Arial, sans-serif;
      font-size: 14px;
    }
    .ql-editor {
      font-size: 14px;
      line-height: 1.6;
      font-family: 'Calibri', Arial, sans-serif;
      padding: 16px;
      min-height: 400px;
      color: #000000;
    }
    .ql-editor p,
    .ql-editor strong,
    .ql-editor span,
    .ql-editor li {

    }
    .ql-editor p,
    .ql-editor li {
      font-size: 14px !important;
    }
    .ql-snow .ql-picker.ql-size {
      width: 62px;
    }
    .ql-snow .ql-picker.ql-size .ql-picker-label::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item::before {
      content: '14px';
    }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="11px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="11px"]::before { content: '11px'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="12px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="12px"]::before { content: '12px'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="13px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="13px"]::before { content: '13px'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="16px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="16px"]::before { content: '16px'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="18px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="18px"]::before { content: '18px'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="20px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="20px"]::before { content: '20px'; }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="24px"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="24px"]::before { content: '24px'; }
    .ql-editor ul,
    .ql-editor ol {
      font-size: 14px !important;
    }
    .doctor-signature {
      margin-top: 25px;
      text-align: left;
    }
    .sig-img {
      margin-bottom: 3px;
    }
    .sig-img img {
      max-width: 120px;
      max-height: 50px;
      display: block;
    }
    .signature-line {
      margin: 1px 0;
      font-size: 15px;
      line-height: 1.2;
      color: #000000;
    }
    .doctor-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 1px;
      color: #000000;
    }
    @media (max-width: 1400px) {
      .sidebar {
        display: none;
      }
      .template-controls {
        display: flex !important;
      }
    }
    @media print {
      body { background: white; }
      .top-bar, .sidebar { display: none; }
      .content-area { padding: 0; }
      .page-wrapper { box-shadow: none; transform: none !important; margin: 0 !important; }
      .ql-toolbar { display: none; }
    }
  
    @media (min-width: 768px) and (max-width: 1400px) {
      .top-bar {
        padding: 10px 16px;
      }

      .patient-info {
        flex-wrap: wrap;
        gap: 8px 20px;
      }

      .controls-row {
        gap: 10px;
      }

      .template-controls {
        flex-wrap: wrap;
      }

      .right-controls {
        flex-wrap: wrap;
      }

      .saved-reports-bar {
        overflow-x: auto;
      }

      .content-area {
        padding: 6px 4px;
        overflow-x: hidden;
      }
    }

    @media (min-width: 768px) and (max-width: 1024px) {
      .controls-row select {
        min-width: 120px;
      }

      .saved-reports-table thead th,
      .saved-reports-table tbody td {
        padding: 6px 8px;
      }
    }

    .top-bar {
      padding: 6px 12px !important;
      flex-shrink: 0;
    }
    .patient-info {
      flex-wrap: wrap;
      gap: 2px 20px;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .controls-row {
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .template-controls {
      flex: 1 1 auto;
      min-width: 0;
      flex-wrap: nowrap;
      gap: 8px;
    }
    .template-controls label,
    .right-controls label {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .controls-row select {
      min-width: 0;
      padding: 4px 8px;
    }
    #navBodyPart {
      flex: 0 1 170px;
      width: auto;
      min-width: 90px;
    }
    #navTemplateSearch {
      flex: 0 1 160px;
      min-width: 70px;
      padding: 4px 8px !important;
    }
    #navTemplate {
      flex: 1 1 200px;
      width: auto;
      min-width: 100px;
      max-width: 100%;
      text-overflow: ellipsis;
    }
    .right-controls {
      margin-left: auto;
      flex: 0 0 auto;
      flex-wrap: nowrap;
      gap: 8px;
      white-space: nowrap;
    }
    #statusSelect {
      flex: 0 0 auto;
    }
    .submit-btn {
      flex: 0 0 auto;
      padding: 6px 16px;
      white-space: nowrap;
    }
    .status-msg {
      flex: 0 1 auto;
      padding: 4px 10px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .saved-reports-bar {
      border-bottom-width: 1px;
      max-height: 104px;
      overflow-y: auto;
    }
    .saved-reports-table thead th {
      padding: 3px 10px;
      position: sticky;
      top: 0;
    }
    .saved-reports-table tbody td {
      padding: 2px 10px;
    }
    .content-area {
      padding: 0 !important;
    }
    .page-content {
      padding: 4px 12px 8px;
    }
    .header-title {
      margin-bottom: 3px;
      padding-bottom: 2px;
    }
    .patient-table {
      margin: 4px 0;
    }
    .patient-table td {
      padding: 2px 8px;
      line-height: 1.2;
    }
    #editor {
      margin-bottom: 4px;
    }

      padding: 3px 8px !important;
    }
    .doctor-signature {
      margin-top: 8px;
    }
    .sig-img {
      margin-bottom: 2px;

    .report-viewer-bar {
      padding: 4px 12px;

    .report-viewer-actions button {
      padding: 3px 12px;
    }

    }

      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="patient-info">
      <div><span>Patient:</span><strong id="hPatientName">-</strong></div>
      <div><span>ID:</span><strong id="hPatientId">-</strong></div>
      <div><span>Age:</span><strong id="hPatientAge">-</strong></div>
      <div><span>Sex:</span><strong id="hPatientSex">-</strong></div>
    </div>
    <div class="controls-row">
      <div class="template-controls" id="navbarTemplates">
        <label>Body Part:</label>
        <select id="navBodyPart">
          <option value="">All</option>
        </select>
        <label>Template:</label>
        <input type="text" id="navTemplateSearch" placeholder="Search template" autocomplete="off" style="padding:6px 10px;font-size:14px;border:1px solid #ccc;border-radius:3px;width:160px;" />
        <select id="navTemplate">
          <option value="">Select</option>
        </select>
      </div>
      <div class="right-controls">
        <label>Status:</label>
        <select id="statusSelect">
          <option value="Draft">Draft</option>
          <option value="Reviewed">Reviewed</option>
          <option value="Reported" selected>Reported</option>
        </select>
        <button class="submit-btn" id="submitBtn">Submit Report</button>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>
  </div>
  <div class="saved-reports-bar" id="savedReportsBar">
    <table class="saved-reports-table">
      <thead>
        <tr>
          <th>Doctor Name</th>
          <th>Report Time</th>
          <th>View Report</th>
          <th>Status</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="savedReportsBody"></tbody>
    </table>
  </div>
  <div class="main-container">
    <div class="sidebar" id="sidebar">
      <h3>Body Part</h3>
      <select id="bodyPartSelect">
        <option value="">All Body Parts</option>
      </select>
      <h3>Template</h3>
      <select id="templateSelect" size="6" style="height: auto;">
        <option value="">Select Template</option>
      </select>
    </div>
    <div class="content-area">
      <div class="report-viewer" id="reportViewer">
        <div class="report-viewer-bar">
          <div class="report-viewer-meta" id="reportViewerMeta"></div>
          <div class="report-viewer-actions">
            <button type="button" class="primary" id="reportViewerBack">Back to Editor</button>
          </div>
        </div>
        <div class="report-viewer-body" id="reportViewerBody"></div>
      </div>
      <div class="page-wrapper" id="pageWrapper">
        <div class="page-content">
          <div class="header-title">DEPARTMENT OF RADIOLOGY AND IMAGING</div>
          <table class="patient-table">
            <tr>
              <td class="label-col"><strong>Name</strong></td>
              <td class="colon-col"><strong>:</strong></td>
              <td class="value-col" id="tName">-</td>
              <td class="label-col"><strong>Patient ID</strong></td>
              <td class="colon-col"><strong>:</strong></td>
              <td class="value-col" id="tId">-</td>
            </tr>
            <tr>
              <td class="label-col"><strong>Age</strong></td>
              <td class="colon-col"><strong>:</strong></td>
              <td class="value-col" id="tAge">-</td>
              <td class="label-col"><strong>Exam date</strong></td>
              <td class="colon-col"><strong>:</strong></td>
              <td class="value-col" id="tExamDate">-</td>
            </tr>
            <tr>
              <td class="label-col"><strong>Sex</strong></td>
              <td class="colon-col"><strong>:</strong></td>
              <td class="value-col" id="tSex">-</td>
              <td class="label-col"><strong>Report date/Time</strong></td>
              <td class="colon-col"><strong>:</strong></td>
              <td class="value-col" id="tReportDateTime">-</td>
            </tr>
            <tr>
              <td class="label-col"><strong>Refd By</strong></td>
              <td class="colon-col"><strong>:</strong></td>
              <td class="value-col" colspan="4" id="tDoctor">-</td>
            </tr>
          </table>
          <div id="editor"></div>
          <div class="doctor-signature">
            <div class="sig-img" id="sigImg"></div>
            <div class="signature-line doctor-name" id="sigName"></div>
            <div class="signature-line" id="sigQual"></div>
            <div class="signature-line" id="sigDesig"></div>
            <div class="signature-line" id="sigInst"></div>
            <div class="signature-line" id="sigBMDC"></div>
            <div class="signature-line" id="sigMobile"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    let quill;
    let patientData = {};
    let currentPatientId = null;
    let doctorInfo = null;
    let allTemplates = {};
    let userPermissions = {
      can_write_reports: false,
      can_manage_templates: false
    };
    const baseUrl = window.location.origin;
    const token = localStorage.getItem('token');
    let reportSubmitting = false;
    let savedReports = [];

    (function() {
      const reportCloseChannel = new BroadcastChannel('doctor_refresh');
      reportCloseChannel.addEventListener('message', function(e) {
      });
    })();

    function getNow() {
      const now = new Date();
      return `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }

    function addReportToList(reportData) {
      savedReports.unshift(reportData);
      renderSavedReports();
    }

    let activeReportIdx = -1;

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function sanitizeReportHtml(html) {
      const doc = new DOMParser().parseFromString(html || '', 'text/html');
      doc.querySelectorAll('script, iframe, object, embed, link, meta, style, form').forEach(function(n) { n.remove(); });
      doc.body.querySelectorAll('*').forEach(function(el) {
        Array.from(el.attributes).forEach(function(a) {
          const n = a.name.toLowerCase();
          if (n.startsWith('on') || ((n === 'href' || n === 'src') && /^\s*javascript:/i.test(a.value))) {
            el.removeAttribute(a.name);
          }
        });
      });
      return doc.body.innerHTML;
    }

    function myReportNames() {
      const names = [];
      if (doctorInfo) {
        [doctorInfo.full_name, doctorInfo.doctor_name, doctorInfo.username].forEach(function(n) {
          if (n && String(n).trim()) names.push(String(n).trim());
        });
      }
      return names;
    }

    function isOwnReport(r) {
      const names = myReportNames();
      if (!names.length) return true;
      return names.indexOf(String(r.reported_by || '').trim()) !== -1;
    }

    function renderSavedReports() {
      const bar = document.getElementById('savedReportsBar');
      const tbody = document.getElementById('savedReportsBody');
      if (!savedReports.length) {
        bar.classList.remove('visible');
        tbody.innerHTML = '';
        closeReportViewer();
        return;
      }
      bar.classList.add('visible');
      tbody.innerHTML = '';
      savedReports.forEach(function(r, idx) {
        const tr = document.createElement('tr');
        if (idx === activeReportIdx) tr.classList.add('active');
        const doctorName = escapeHtml(r.reported_by || (doctorInfo && doctorInfo.full_name) || '-');
        const reportTime = escapeHtml(r.updated_at || getNow());
        const status = escapeHtml(r.status || '-');
        const reportFileUrl = r.report_file || '';
        const dicomId = escapeHtml(r.dicom_id || currentPatientId || '');
        let viewReportHtml = '-';
        if (reportFileUrl || r.report_content) {
          viewReportHtml = `<a class="report-file-link" href="#"><span class="word-icon">W</span>${dicomId}</a>`;
        } else {
          viewReportHtml = `<span style="color:#999;">${dicomId}</span>`;
        }
        const deleteHtml = (r.id && isOwnReport(r))
          ? `<button class="delete-report-btn" title="Delete my report" onclick="event.stopPropagation();deleteSavedReport(${idx})">&#10005;</button>`
          : '<span style="color:#bbb;">-</span>';
        tr.innerHTML = `
          <td>${doctorName}</td>
          <td>${reportTime}</td>
          <td class="view-report-cell">${viewReportHtml}</td>
          <td>${status}</td>
          <td>${deleteHtml}</td>
        `;
        const viewCell = tr.querySelector('.view-report-cell');
        if (viewCell && (reportFileUrl || r.report_content)) {
          viewCell.addEventListener('click', function(e) {
            e.preventDefault();
            openReportViewer(idx);
          });
        }
        tbody.appendChild(tr);
      });
    }

    function resolveReportContent(r) {
      if (r.report_content && r.report_content.trim()) return r.report_content;
      if (r.report_file) {
        const twin = savedReports.find(function(o) {
          return o !== r && o.report_file === r.report_file && o.report_content && o.report_content.trim();
        });
        if (twin) return twin.report_content;
      }
      return '';
    }

    function openReportViewer(idx) {
      const r = savedReports[idx];
      if (!r) return;
      activeReportIdx = idx;
      const table = document.querySelector('.patient-table').cloneNode(true);
      const timeCell = table.querySelector('#tReportDateTime');
      if (timeCell) timeCell.textContent = r.updated_at || '-';
      const examCell = table.querySelector('#tExamDate');
      if (examCell && r.exam_date) examCell.textContent = r.exam_date;
      table.querySelectorAll('[id]').forEach(function(el) { el.removeAttribute('id'); });
      const meta = document.getElementById('reportViewerMeta');
      meta.innerHTML = `<strong>${escapeHtml(r.reported_by || '-')}</strong>${escapeHtml(r.updated_at || '')}${r.status ? ' &middot; ' + escapeHtml(r.status) : ''}${r.study_description ? ' &middot; ' + escapeHtml(r.study_description) : ''}`;
      const body = document.getElementById('reportViewerBody');
      body.innerHTML = '';
      const title = document.createElement('div');
      title.className = 'header-title';
      title.textContent = 'DEPARTMENT OF RADIOLOGY AND IMAGING';
      body.appendChild(title);
      body.appendChild(table);
      const container = document.createElement('div');
      container.className = 'ql-container ql-snow';
      const content = document.createElement('div');
      content.className = 'ql-editor';
      const reportHtml = resolveReportContent(r);
      content.innerHTML = reportHtml
        ? sanitizeReportHtml(reportHtml)
        : '<p style="color:#777;">No report text was saved for this entry.</p>';
      container.appendChild(content);
      body.appendChild(container);
      if (r.reported_by) {
        const doc = document.createElement('div');
        doc.className = 'report-viewer-doctor';
        doc.textContent = r.reported_by;
        body.appendChild(doc);
      }
      document.getElementById('pageWrapper').style.display = 'none';
      document.getElementById('reportViewer').classList.add('visible');
      document.querySelector('.content-area').scrollTop = 0;
      renderActiveRow();
    }

    function renderActiveRow() {
      const rows = document.querySelectorAll('#savedReportsBody tr');
      rows.forEach(function(tr, i) {
        tr.classList.toggle('active', i === activeReportIdx);
      });
    }

    function closeReportViewer() {
      activeReportIdx = -1;
      const viewer = document.getElementById('reportViewer');
      if (viewer) viewer.classList.remove('visible');
      const wrapper = document.getElementById('pageWrapper');
      if (wrapper) wrapper.style.display = '';
      renderActiveRow();
    }

    async function deleteSavedReport(idx) {
      const r = savedReports[idx];
      if (!r) return;
      if (!r.id || !isOwnReport(r)) {
        showMsg('You can only delete your own report', 'error');
        return;
      }
      if (!confirm('Delete this report permanently? This cannot be undone.')) return;
      try {
        const res = await fetch(`${baseUrl}/api/delete-report-history/`, {
          method: 'POST',
          headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: r.id })
        });
        const data = await res.json().catch(function() { return {}; });
        if (!res.ok || !data.success) {
          showMsg(data.error || 'Could not delete report', 'error');
          return;
        }
        const wasActive = idx === activeReportIdx;
        savedReports.splice(idx, 1);
        if (wasActive) {
          closeReportViewer();
        } else if (activeReportIdx > idx) {
          activeReportIdx -= 1;
        }
        renderSavedReports();
        showMsg('Report deleted', 'success');
      } catch (e) {
        console.error('Delete report failed:', e);
        showMsg('Could not delete report', 'error');
      }
    }

    async function refreshSavedReports() {
      if (!currentPatientId) return;
      try {
        const res = await fetch(`${baseUrl}/api/dicom-images/${currentPatientId}/report-history/?scope=patient`, {
          headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json' }
        });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.success || !data.history) return;
        savedReports = data.history.map(function(entry) {
          return {
            id: entry.id || null,
            reported_by: entry.reported_by || '',
            updated_at: entry.created_at || '',
            created_at: entry.created_at || '',
            status: entry.status || '',
            report_file: entry.report_file || '',
            report_content: entry.report_content || '',
            dicom_id: entry.dicom_id || currentPatientId,
            exam_date: entry.exam_date || '',
            study_description: entry.study_description || ''
          };
        });
        activeReportIdx = -1;
        closeReportViewer();
        renderSavedReports();
      } catch (e) {
        console.error('Could not refresh report list:', e);
      }
    }

    function populateBodyParts(grouped) {
      const parts = Object.keys(grouped).sort();
      [document.getElementById('bodyPartSelect'), document.getElementById('navBodyPart')].forEach(select => {
        select.innerHTML = '<option value="">All Body Parts</option>';
        parts.forEach(bp => {

          opt.textContent = bp;
          select.appendChild(opt);
        });

    const TEMPLATE_CATEGORY_MODALITIES = {
      'CT TEMPLATES': ['CT'],
      'MRI TEMPLATES': ['MR'],
      'X-RAY TEMPLATES': ['CR', 'RF', 'DX', 'MG', 'DR', 'PX']
    };
    
    function populateTemplates(grouped, filterBP = '', filterModality = '') {
      const parts = filterBP ? [filterBP] : Object.keys(grouped).sort();
      const allowedModalities = filterModality
        ? (TEMPLATE_CATEGORY_MODALITIES[filterBP] || [filterModality.toUpperCase()])
        : null;
      [document.getElementById('templateSelect'), document.getElementById('navTemplate')].forEach(select => {
        const isSidebar = select.id === 'templateSelect';
        select.innerHTML = '<option value="">Select Template</option>';
        parts.forEach(bp => {
          if (!grouped[bp]) return;
          grouped[bp].forEach(tmpl => {
            if (allowedModalities && !allowedModalities.includes((tmpl.modality || '').toUpperCase())) return;
            const opt = document.createElement('option');
            opt.value = tmpl.id;
            opt.textContent = isSidebar ? `${bp} - ${tmpl.template_name}` : tmpl.template_name;
            opt.dataset.content = tmpl.content;
            opt.dataset.bodypart = tmpl.body_part;
            opt.dataset.templatename = tmpl.template_name;
            select.appendChild(opt);
          });
        });
      });
    }
    
    function getTemplateCategoryForModality(modality) {
      const m = (modality || '').toString().trim().toUpperCase();
      if (m === 'CT') return 'CT TEMPLATES';
      if (m === 'MR') return 'MRI TEMPLATES';
      if (['CR', 'RF', 'DX', 'MG', 'DR', 'PX'].includes(m)) return 'X-RAY TEMPLATES';
      return '';
    }
    
    let studyModality = '';
    function applyStudyModalityFilter(modality) {
      studyModality = (modality || '').toString().trim().toUpperCase();
      const category = getTemplateCategoryForModality(studyModality);
      if (!category) return;
      
      [document.getElementById('bodyPartSelect'), document.getElementById('navBodyPart')].forEach(select => {
        select.innerHTML = `<option value="${category}">${category}</option>`;
        select.value = category;
      });
      
      populateTemplates(allTemplates, category, category);
      if (typeof window.__refreshTemplateSuggestions === 'function') {
        window.__refreshTemplateSuggestions();
      }
    }

    (function () {
      const searchInput = document.getElementById('navTemplateSearch');
      const navSelect = document.getElementById('navTemplate');

      function applyNavTemplateFilter() {
        const q = searchInput.value.trim().toLowerCase();
        Array.from(navSelect.options).forEach(opt => {
          if (!opt.value) return;
          const match = !q || opt.textContent.toLowerCase().includes(q);
          opt.hidden = !match;
          opt.style.display = match ? '' : 'none';
        });
      }

      searchInput.addEventListener('input', applyNavTemplateFilter);

      searchInput.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const first = Array.from(navSelect.options).find(opt => opt.value && !opt.hidden);
        if (first) {
          navSelect.value = first.value;
          navSelect.dispatchEvent(new Event('change'));
        }
      });

      new MutationObserver(() => {
        if (searchInput.value.trim()) applyNavTemplateFilter();
      }).observe(navSelect, { childList: true });
    })();
    
    function updatePatientInfo(data) {
      const name = data.patientName || 'Unknown';
      const id = data.patientId || 'N/A';
      const age = (data.patientAge && parseInt(data.patientAge) !== 0) ? data.patientAge : 'N/A';
      const sex = (data.patientGender || 'U').toString().charAt(0).toUpperCase();
      const doctor = (data.referringPhysician && data.referringPhysician.trim() !== '') ? data.referringPhysician : 'N/A';
      const now = new Date();
      
  
      let examDate;
      if (data.examDate && data.examDate.trim() !== '') {
        
        const parts = data.examDate.split('/');
        if (parts.length === 3) {
          examDate = `${parts[1]}-${parts[0]}-${parts[2]}`;
        } else {
          examDate = data.examDate;
        }
      } else {
    
        examDate = `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()}`;
      }
      
      const reportDateTime = `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      
      document.getElementById('hPatientName').textContent = name;
      document.getElementById('hPatientId').textContent = id;
      document.getElementById('hPatientAge').textContent = age;
      document.getElementById('hPatientSex').textContent = sex;
      document.getElementById('tName').textContent = name;
      document.getElementById('tId').textContent = id;
      document.getElementById('tAge').textContent = age + 'Y';
      document.getElementById('tSex').textContent = sex;
      document.getElementById('tExamDate').textContent = examDate;
      document.getElementById('tReportDateTime').textContent = reportDateTime;
      document.getElementById('tDoctor').textContent = doctor;
    }
    
    let currentViewerLink = "";
    let dataReceived = false;

    async function fetchStudyRecord() {
      if (!currentPatientId) return null;
      try {
        const res = await fetch(`${baseUrl}/api/dicom-images/${currentPatientId}/`, {
          headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json' }
        });
        if (res.ok) {
          return await res.json();
        }
      } catch (e) {
        console.error('Could not load study record:', e);
      }
      return null;
    }

    function isBlank(value) {
      return value === undefined || value === null || value.toString().trim() === '';
    }

    async function completeFromRecord(data) {
      const needsRecord = isBlank(data.modality) || isBlank(data.patientGender) ||
        isBlank(data.referringPhysician) || isBlank(data.patientName) || isBlank(data.patientId) ||
        isBlank(data.examDate) || isBlank(data.patientAge) || parseInt(data.patientAge) === 0;
      if (!needsRecord) return;
      const record = await fetchStudyRecord();
      if (!record) return;
      if (isBlank(data.modality)) data.modality = record.modality || '';
      if (isBlank(data.patientName)) data.patientName = record.patient_name || '';
      if (isBlank(data.patientId)) data.patientId = record.patient_id || '';
      if (isBlank(data.patientGender)) data.patientGender = record.patient_sex || '';
      if (isBlank(data.referringPhysician)) data.referringPhysician = record.referring_physician || '';
      if ((isBlank(data.patientAge) || parseInt(data.patientAge) === 0) && record.age) {
        data.patientAge = String(record.age);
      }
      if (isBlank(data.examDate) && record.study_date && String(record.study_date).length >= 8) {
        const sd = String(record.study_date);
        data.examDate = `${sd.substring(4, 6)}/${sd.substring(6, 8)}/${sd.substring(0, 4)}`;
      }
    }

    async function handleData(data) {
      if (dataReceived) return;
      dataReceived = true;
      patientData = data;
      if (data.dicomImageId) {
        currentPatientId = parseInt(data.dicomImageId) || data.dicomImageId;
      } else if (data.patientId) {
        currentPatientId = parseInt(data.patientId) || data.patientId;
      }
      if (data.viewer_link) {
        currentViewerLink = data.viewer_link;
      }
      updatePatientInfo(data);
      await completeFromRecord(data);
      updatePatientInfo(data);
      applyStudyModalityFilter(data.modality || '');
      await loadExistingReport();
    }

    async function loadExistingReport() {
      if (!currentPatientId) return;
      let historyLoaded = false;
      try {
        const res = await fetch(`${baseUrl}/api/dicom-images/${currentPatientId}/report-history/?scope=patient`, {
          headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json' }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.history && data.history.length > 0) {
            historyLoaded = true;
            savedReports = [];
            data.history.forEach(function(entry) {
              savedReports.push({
                id: entry.id || null,
                reported_by: entry.reported_by || '',
                updated_at: entry.created_at || '',
                created_at: entry.created_at || '',
                status: entry.status || '',
                report_file: entry.report_file || '',
                report_content: entry.report_content || '',
                dicom_id: entry.dicom_id || currentPatientId,
                exam_date: entry.exam_date || '',
                study_description: entry.study_description || ''
              });
            });
            renderSavedReports();
            const latest = data.history.find(function(e) {
              return e.report_content && e.report_content.trim();
            });
            if (latest) {
              const applyContent = () => {
                if (quill) {
                  quill.root.innerHTML = latest.report_content;
                  const statusSel = document.getElementById('statusSelect');
                  if (statusSel && latest.status) statusSel.value = latest.status;
                  showMsg('Previously saved report loaded', 'success');
                } else {
                  setTimeout(applyContent, 100);
                }
              };
              applyContent();
            }
          }
        }
      } catch (e) {
        console.error('Could not load report history:', e);
      }
      // Fallback: if history endpoint returned nothing, load from single-report endpoint
      if (!historyLoaded) {
        try {
          const fallback = await fetch(`${baseUrl}/api/dicom-images/${currentPatientId}/report/`, {
            headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json' }
          });
          if (fallback.ok) {
            const reportData = await fallback.json();
            if (reportData.success && reportData.report_content && reportData.report_content.trim()) {
              savedReports = [{
                reported_by: reportData.reported_by || '',
                updated_at: reportData.updated_at || '',
                created_at: reportData.updated_at || '',
                status: reportData.status || '',
                report_file: reportData.report_file || '',
                report_content: reportData.report_content,
                dicom_id: reportData.dicom_id || currentPatientId
              }];
              renderSavedReports();
              const applyContent = () => {
                if (quill) {
                  quill.root.innerHTML = reportData.report_content;
                  const statusSel = document.getElementById('statusSelect');
                  if (statusSel && reportData.status) statusSel.value = reportData.status;
                  showMsg('Previously saved report loaded', 'success');
                } else {
                  setTimeout(applyContent, 100);
                }
              };
              applyContent();
            }
          }
        } catch (e) {
          console.error('Could not load existing report:', e);
        }
      }
    }

      el.textContent = msg;
      el.className = `status-msg ${type}`;
      setTimeout(() => {
        el.className = 'status-msg';

    }
    
    async function generateDoc() {

      const ageSex = document.getElementById('tAgeSex').textContent;
      const dt = document.getElementById('tExam').textContent;
      const doc = document.getElementById('tDoctor').textContent;
      const report = quill.root.innerHTML;
      
      const dName = doctorInfo.full_name || '';
      const dDesig = doctorInfo.designation || '';
      const dQual = doctorInfo.qualification || '';
      const dInst = doctorInfo.institute_name || '';
      const dBMDC = doctorInfo.bmdc_reg_no ? `BMDC Reg No: ${doctorInfo.bmdc_reg_no}` : '';

      let sigTag = '';
      if (dSig) {
        const fullUrl = dSig.startsWith('http') ? dSig : `${baseUrl}${dSig}`;
        sigTag = `<div class="sig-img"><img src="${fullUrl}" style="max-width: 120px; max-height: 50px;"></div>`;
      }
      const html = `<!DOCTYPE html>
<html>
<head>

  </style>
</head>
<body>
  <div class="title">DEPARTMENT OF RADIOLOGY AND IMAGING</div>
  <table class="patient-table" border="2" cellpadding="6" cellspacing="0" bordercolor="#000000">
    <tbody>
    <tr>
      <td class="label-col"><b>Name :</b></td>
      <td class="value-col">${name}</td>
    </tr>
    <tr>
      <td class="label-col"><b>Patient ID :</b></td>

  </div>

</html>`;
      const blob = new Blob([html], { type: 'application/msword' });
      const ts = new Date().toISOString().slice(0, 19).replace(/[-:]/g, '');
      const filename = `Report_${currentPatientId}_${ts}.doc`;
      return { blob, filename };
    }
    
    document.getElementById('submitBtn').addEventListener('click', async function() {
      const btn = this;
      const stat = document.getElementById('statusSelect').value;
      if (!token) {
        showMsg('Authentication required', 'error');
        return;
      }
      
      if (!userPermissions.can_write_reports) {
        showMsg('You do not have permission to write reports', 'error');
        return;
      }
      
      if (!currentPatientId) {
        showMsg('Patient ID not found', 'error');
        console.error('No patient ID available');
        return;
      }
      const reportText = quill.getText().trim();
      const reportHTML = quill.root.innerHTML.trim();
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = reportHTML;
      const actualText = tempDiv.textContent.trim();
      if (!actualText || actualText.length < 5) {
        showMsg('Please enter report content', 'error');
        return;
      }
      try {
        btn.disabled = true;
        reportSubmitting = true;
        showMsg('Generating...', 'success');
        
        console.log("Viewer link:", currentViewerLink);
        
        const now = new Date();
        const reportSubmissionDateTime = `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        
        const displayedExamDate = document.getElementById('tExamDate').textContent;
        const examDateTime = `${displayedExamDate} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        const docxRes = await fetch(`${baseUrl}/api/generate-report-docx/`, {
          method: 'POST',
          headers: {
            'Authorization': `Token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            patient_data: Object.assign({}, patientData, {
              patientName: document.getElementById('tName').textContent,
              patientId: document.getElementById('tId').textContent,
              patientAge: document.getElementById('hPatientAge').textContent,
              patientGender: document.getElementById('hPatientSex').textContent,
              referringPhysician: document.getElementById('tDoctor').textContent
            }),
            report_content: reportHTML,
            doctor_info: doctorInfo,
            patient_id: currentPatientId,
            exam_date: examDateTime,
            viewer_link: currentViewerLink,
            report_submission_datetime: reportSubmissionDateTime
          })
        });
        
        if (!docxRes.ok) {
          throw new Error('DOCX generation failed');
        }
        
        const docxBlob = await docxRes.blob();
        const ts = new Date().toISOString().slice(0, 19).replace(/[-:]/g, '');
        const filename = `Report_${currentPatientId}_${ts}.docx`;
        
        const fd = new FormData();
        fd.append('file', docxBlob, filename);
        fd.append('report_content', reportHTML);
        
        console.log('Uploading report to:', `${baseUrl}/api/dicom-images/${currentPatientId}/upload_report/`);
        const upRes = await fetch(`${baseUrl}/api/dicom-images/${currentPatientId}/upload_report/`, {
          method: 'POST',
          headers: { 'Authorization': `Token ${token}` },
          body: fd
        });
        
        if (!upRes.ok) {
          const errText = await upRes.text();
          console.error('Upload failed:', upRes.status, errText);
          throw new Error(`Upload failed: ${upRes.status}`);
        }
        
        const uploadData = await upRes.json();
        console.log('Upload response:', uploadData);
        
        console.log('Updating status to:', stat);
        const stRes = await fetch(`${baseUrl}/api/dicom-images/${currentPatientId}/update_status/`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            status: stat,
            reported_by: doctorInfo.full_name || '',
            report_content: reportHTML
          })
        });
        
        if (!stRes.ok) {
          const errText = await stRes.text();
          console.error('Status update failed:', stRes.status, errText);
          throw new Error(`Status update failed: ${stRes.status}`);
        }
        
        const statusData = await stRes.json();
        
        showMsg('Report saved successfully', 'success');
        
        const savedReportEntry = {
          reported_by: doctorInfo.full_name || '',
          updated_at: reportSubmissionDateTime,
          status: stat,
          report_file: null,
          report_content: reportHTML,
          dicom_id: currentPatientId
        };

        try {
          const fetchedReport = await fetch(`${baseUrl}/api/dicom-images/${currentPatientId}/report/`, {
            headers: { 'Authorization': `Token ${token}`, 'Content-Type': 'application/json' }
          });
          if (fetchedReport.ok) {
            const fetchedData = await fetchedReport.json();
            if (fetchedData.success && fetchedData.report_file) {
              savedReportEntry.report_file = fetchedData.report_file;
            }
          }
        } catch (e) {}

        addReportToList(savedReportEntry);
        refreshSavedReports();
        btn.disabled = false;
        reportSubmitting = false;
        
        try {
          const payload = {
            type: 'reportSaved',
            dicomImageId: currentPatientId || null,
            studyUID: (statusData && statusData.study_instance_uid) || (patientData && (patientData.studyInstanceUID || patientData.studyId)) || null,
            modality: (statusData && statusData.modality) || (patientData && patientData.modality) || null,
            status: stat
          };
          const bc = new BroadcastChannel('doctor_refresh');
          bc.postMessage(payload);
          bc.close();
          if (window.opener && !window.opener.closed) {
            try { window.opener.postMessage(payload, window.location.origin); } catch (e) {}
          }
          try {
            let w = window.opener;
            while (w) {
              try { w.postMessage({ type: 'refreshDoctor', ...payload }, window.location.origin); } catch (e) {}
              if (w.opener && !w.opener.closed) { w = w.opener; } else { break; }
            }
          } catch (e) {}
        } catch (e) {}
      } catch (err) {
        console.error('Submit error:', err);
        showMsg(`Error: ${err.message}`, 'error');
        btn.disabled = false;
        reportSubmitting = false;
      }
    });
    
    document.addEventListener('keydown', function(e) {
      if (e.shiftKey && e.key === 'Enter') {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn && !submitBtn.disabled) {
          submitBtn.click();
        }
      }
      if (e.key === 'Escape') {
        try {
          const bc = new BroadcastChannel('doctor_refresh');
          bc.postMessage({ type: 'closeViewer' });
          bc.close();
        } catch (err) {}
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'closeViewer' }, window.location.origin);
          }
        } catch (err) {}
        window.close();
      }
    });
    
    (function() {
      const sugg = document.createElement('div');
      sugg.id = 'templateSuggestionBox';
      sugg.style.position = 'absolute';
      sugg.style.zIndex = 9999;
      sugg.style.minWidth = '220px';
      sugg.style.maxWidth = '520px';
      sugg.style.background = '#fff';
      sugg.style.border = '1px solid #ccc';
      sugg.style.boxShadow = '0 2px 6px rgba(0,0,0,0.12)';
      sugg.style.borderRadius = '4px';
      sugg.style.display = 'none';
      sugg.style.maxHeight = '220px';
      sugg.style.overflowY = 'auto';
      sugg.style.fontFamily = 'Calibri, Arial, sans-serif';
      sugg.style.fontSize = '15px';
      sugg.style.padding = '4px 0';
      document.body.appendChild(sugg);
      const style = document.createElement('style');
      style.innerHTML = `
        #templateSuggestionBox .ti { padding: 6px 10px; cursor: pointer; }
        #templateSuggestionBox .ti:hover, #templateSuggestionBox .ti.active { background: #f0f8ff; }
        #templateSuggestionBox .sub { color: #666; font-size: 13px; margin-left: 8px; }
      `;
      document.head.appendChild(style);
      let flattenedTemplates = [];
      function flattenAllTemplates() {
        flattenedTemplates = [];
        const category = getTemplateCategoryForModality(studyModality);
        const allowedModalities = category ? (TEMPLATE_CATEGORY_MODALITIES[category] || null) : null;
        Object.keys(allTemplates || {}).forEach(bp => {
          (allTemplates[bp] || []).forEach(t => {
            if (allowedModalities && !allowedModalities.includes((t.modality || '').toUpperCase())) return;
            flattenedTemplates.push(Object.assign({}, t, { body_part: bp }));
          });
        });
      }
      window.__refreshTemplateSuggestions = flattenAllTemplates;
      const origLoadTemplates = loadTemplates;
      loadTemplates = async function() {
        await origLoadTemplates();
        flattenAllTemplates();
      };
      if (Object.keys(allTemplates || {}).length) flattenAllTemplates();
      let currentIndex = -1;
      function showSuggestions(items, coords) {
        if (!items || items.length === 0) {
          hideSuggestions();
          return;
        }
        sugg.innerHTML = '';
        items.slice(0, 20).forEach((it, i) => {
          const div = document.createElement('div');
          div.className = 'ti';
          div.dataset.index = i;
          div.innerHTML = `<strong>${escapeHtml(it.template_name)}</strong><span class="sub">${escapeHtml(it.body_part || '')}</span>`;
          div.addEventListener('mousedown', (ev) => {
            ev.preventDefault();
            selectSuggestion(it);
          });
          sugg.appendChild(div);
        });
        const editorBounds = document.querySelector('#editor .ql-editor') || document.getElementById('editor');
        if (coords) {
          sugg.style.left = coords.left + 'px';
          sugg.style.top = (coords.top + coords.height + 4) + 'px';
        } else if (editorBounds) {
          const rect = editorBounds.getBoundingClientRect();
          sugg.style.left = (rect.left + 10) + 'px';
          sugg.style.top = (rect.bottom + 6) + 'px';
        }
        sugg.style.display = 'block';
        currentIndex = -1;
        updateActiveItem();
      }
      function updateActiveItem() {
        Array.from(sugg.querySelectorAll('.ti')).forEach(el => el.classList.remove('active'));
        if (currentIndex >= 0) {
          const el = sugg.querySelector(`.ti[data-index="${currentIndex}"]`);
          if (el) {
            el.classList.add('active');
            const r = el.getBoundingClientRect();
            const s = sugg.getBoundingClientRect();
            if (r.bottom > s.bottom) el.scrollIntoView(false);
            if (r.top < s.top) el.scrollIntoView();
          }
        }
      }
      function hideSuggestions() {
        sugg.style.display = 'none';
        currentIndex = -1;
      }
      function escapeHtml(s) {
        if (!s) return '';
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      async function selectSuggestion(template) {
        if (!quill || !template) return;
        hideSuggestions();
        applyTemplateToEditor(template);
      }
      function setupTextListener() {
        quill.on('text-change', (delta, oldDelta, source) => {
          if (source !== 'user') return;
          try {
            const range = quill.getSelection();
            if (!range) { hideSuggestions(); return; }
            const maxLen = 100;
            const start = Math.max(0, range.index - maxLen);
            const text = quill.getText(start, range.index - start);
            const m = text.match(/(\S+)$/);
            const lastWord = m ? m[1] : '';
            if (!lastWord || lastWord.trim().length === 0) {
              hideSuggestions();
              return;
            }
            const q = lastWord.trim().toLowerCase();
            if (!flattenedTemplates || flattenedTemplates.length === 0) flattenAllTemplates();
            const matches = flattenedTemplates.filter(t => {
              const name = (t.template_name || '').toLowerCase();
              const content = (t.content || '').replace(/<[^>]*>/g,' ').toLowerCase();
              return (name.startsWith(q) || content.trim().startsWith(q));
            }).map(t => ({ template_name: t.template_name, content: t.content, body_part: t.body_part, id: t.id }));
            if (matches.length === 0) {
              hideSuggestions();
              return;
            }
            let coords;
            try {
              const bounds = quill.getBounds(range.index);
              const editorRect = document.querySelector('#editor .ql-editor').getBoundingClientRect();
              coords = {
                left: editorRect.left + bounds.left,
                top: editorRect.top + bounds.top,
                height: bounds.height
              };
            } catch (e) {
              coords = null;
            }
            showSuggestions(matches, coords);
          } catch (err) {
            console.error('Suggestion error:', err);
            hideSuggestions();
          }
        });
        document.addEventListener('keydown', function(ev) {
          if (sugg.style.display === 'none') return;
          const items = sugg.querySelectorAll('.ti');
          if (!items || items.length === 0) return;
          if (ev.key === 'ArrowDown') {
            ev.preventDefault();
            ev.stopPropagation();
            currentIndex = (currentIndex + 1) % items.length;
            updateActiveItem();
          } else if (ev.key === 'ArrowUp') {
            ev.preventDefault();
            ev.stopPropagation();
            currentIndex = currentIndex <= 0 ? items.length - 1 : currentIndex - 1;
            updateActiveItem();
          } else if (ev.key === 'Enter' || ev.key === 'Tab') {
            if (currentIndex >= 0 || items.length === 1) {
              ev.preventDefault();
              ev.stopPropagation();
              const idx = currentIndex >= 0 ? currentIndex : 0;
              const itemEl = sugg.querySelector(`.ti[data-index="${idx}"]`);
              if (itemEl) {
                const allItems = flattenedTemplates.filter(t => {
                  const name = (t.template_name || '').toLowerCase();
                  const content = (t.content || '').replace(/<[^>]*>/g,' ').toLowerCase();
                  const range = quill.getSelection();
                  if (!range) return false;
                  const maxLen = 100;
                  const start = Math.max(0, range.index - maxLen);
                  const text = quill.getText(start, range.index - start);
                  const m = text.match(/(\S+)$/);
                  const lastWord = m ? m[1] : '';
                  const q = lastWord.trim().toLowerCase();
                  return (name.startsWith(q) || content.trim().startsWith(q));
                });
                if (allItems[idx]) {
                  selectSuggestion(allItems[idx]);
                }
              }
            }
          } else if (ev.key === 'Escape') {
            ev.preventDefault();
            hideSuggestions();
            quill.focus();
          }
        }, true);
        document.addEventListener('mousedown', function(e) {
          if (!sugg.contains(e.target)) hideSuggestions();
        });
      }
      if (typeof quill !== 'undefined') {
        setupTextListener();
      } else {
        const qCheck = setInterval(() => {
          if (typeof quill !== 'undefined') {
            clearInterval(qCheck);
            setupTextListener();
          }
        }, 150);
      }
    })();
    
    document.addEventListener('DOMContentLoaded', async function() {
      const access = await checkAccess();
      if (access) {
        initQuill();
        await loadTemplates();
        setTimeout(() => {
          checkScreenSize();
          scalePaper();
        }, 100);
        window.addEventListener('message', (e) => {
          if (e.data?.type === 'patientData' && e.data?.data) {
            handleData(e.data.data);
          }
        });

        setTimeout(() => {
          try {
            const urlParams = new URLSearchParams(window.location.search);
            const dicomIdFromUrl = urlParams.get('dicom_id');
            const storageKey = urlParams.get('key');

            if (storageKey) {
              const saved = sessionStorage.getItem(storageKey);
              if (saved) {
                const data = JSON.parse(saved);
                if (data && Object.keys(data).length > 0) {
                  handleData(data);
                  return;
                }
              }
            }

            if (dicomIdFromUrl && !dataReceived) {
              currentPatientId = parseInt(dicomIdFromUrl) || dicomIdFromUrl;
              patientData = { dicomImageId: currentPatientId };
              updatePatientInfo(patientData);
              loadExistingReport();
              return;
            }

            const saved = localStorage.getItem('patientDataForReport');
            if (saved) {
              const data = JSON.parse(saved);
              if (data && Object.keys(data).length > 0) {
                handleData(data);
              }
            }
          } catch (e) {
            console.error('Session error:', e);
          }
        }, 400);
      } else {
        showMsg('Access denied', 'error');
      }
    });
  </script>
